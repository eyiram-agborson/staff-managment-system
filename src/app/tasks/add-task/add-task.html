<div class="mx-auto max-w-2xl px-4 py-6 md:px-8">

  <div class="rounded-lg border border-gray-200 bg-white p-5 md:p-7">

    <div class="mb-6">
      <h1 class="text-lg font-semibold text-gray-900 md:text-2xl">
        Add Task
      </h1>

      <p class="mt-1 text-xs text-gray-500 md:text-sm">
        Create a new task and add it to the task list.
      </p>
    </div>

    <div class="space-y-4">

      <!-- Task Title -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Task Title
        </label>

        <input [(ngModel)]="newTask.title" nz-input type="text"
          placeholder="Enter task title"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Description
        </label>

        <textarea [(ngModel)]="newTask.description" nz-input rows="3"
          placeholder="Enter task description">
        </textarea>
      </div>

      <!-- Priority -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Priority
        </label>

        <nz-select [(ngModel)]="newTask.priority" nzPlaceHolder="Select priority" class="w-full">

          <nz-option nzValue="high" nzLabel="High" />
          <nz-option nzValue="medium" nzLabel="Medium" />
          <nz-option nzValue="low" nzLabel="Low" />

        </nz-select>
      </div>

      <!-- Status -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Status
        </label>

        <nz-select [(ngModel)]="newTask.status" nzPlaceHolder="Select status" class="w-full">

          <nz-option nzValue="pending" nzLabel="Pending" />
          <nz-option nzValue="in-progress" nzLabel="In Progress" />
          <nz-option nzValue="completed" nzLabel="Completed" />

        </nz-select>
      </div>

      <!-- Deadline -->
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Deadline
        </label>

        <input [(ngModel)]="newTask.deadline" nz-input type="date"
        />
      </div>

    </div>

    <!-- Buttons -->
    <div class="mt-6 flex justify-end gap-4">

      <button
        type="button"
        (click)="cancel()"
        class="rounded-md border border-red-300 px-4 py-2 text-sm font-medium !text-red-400 hover:bg-gray-50 md:px-7">
        Cancel
      </button>

      <button type="button" (click)="addTask()" class="rounded-md bg-blue-500 px-4 py-2 text-sm !text-white hover:bg-blue-400 md:px-10">
        Save
      </button>

    </div>

  </div>

</div>
