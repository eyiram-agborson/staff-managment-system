<div class="relative max-h-screen px-4 py-5 md:px-8">

  <!-- Header -->
  <div class="mb-4 flex items-center justify-between rounded-lg px-4 py-4 md:px-0">

    <h1 class="text-base font-semibold text-gray-900 md:text-2xl">
      Tasks
    </h1>

    <div class="flex justify-between items-center gap-5">
      <button type="button"
      class="h-9 rounded-sm bg-blue-400 px-4 md:px-7 text-xs font-medium !text-white transition hover:bg-blue-700 md:text-sm">
      Add Task
    </button>

    <nz-select nzAllowClear nzPlaceHolder="Status" class="w-full md:w-[150px]">
      <nz-option nzValue="Pending" nzLabel="Pending" />
      <nz-option nzValue="In-Progress" nzLabel="In-Progress" />
      <nz-option nzValue="Completed" nzLabel="Completed" />
    </nz-select>

    <nz-select nzAllowClear nzPlaceHolder="Priority" class="w-full md:w-[150px]">
      <nz-option nzValue="High" nzLabel="High" />
      <nz-option nzValue="Medium" nzLabel="Medium" />
      <nz-option nzValue="Low" nzLabel="Low" />
    </nz-select>
    </div>
  

  </div>


  <!-- Table -->
<div class="mx-4 overflow-x-auto rounded-lg border border-gray-200 bg-white md:px-5">
    <nz-table #taskTable [nzData]="listOfTasks" [nzPageSize]="5">
      <thead>
        <tr>
          <th>Task Id</th>
          <th>Title</th>
          <th>Description</th>
          <th>Assigned To</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Deadline</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        @for (task of taskTable.data; track task.id) {
          <tr>
            <td>{{ task.id }}</td>
            <td class="font-medium">{{ task.title }}</td>
            <td class="italic">{{ task.description }}</td>
            <td>{{ task.assignedTo }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.status }}</td>
            <td>{{ task.deadline }}</td>
            <td class="text-center">
              <button type="button"
                class="text-sm text-gray-600 transition hover:text-blue-600">
                ⋮
              </button>
            </td>
          </tr>
        }

      </tbody>
    </nz-table>

  </div>

</div>
