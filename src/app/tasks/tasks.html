<div class="min-h-screen bg-white">

  <!-- Header -->
  <div class="flex items-center justify-between border-b border-gray-200 px-4 py-4 md:px-6">

    <h1 class="text-base font-semibold text-gray-900 md:text-lg">
      Tasks
    </h1>

    <button
      nz-button
      nzType="primary"
      (click)="addTask()"
      class="!h-9 !rounded-md !px-4 !text-xs md:!text-sm">

      <span nz-icon nzType="plus"></span>

      Add Task
    </button>

  </div>


  <!-- Search + Filters -->
  <div class="flex flex-col gap-3 border-b border-gray-200 px-4 py-4 md:flex-row md:items-center md:justify-end md:px-6">

    <!-- Search -->
    <div class="w-full md:w-[280px]">

      <nz-input-group nzPrefixIcon="search">

        <input
          nz-input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search tasks" />

      </nz-input-group>

    </div>


    <!-- Status Filter -->
    <nz-select
      [(ngModel)]="selectedStatus"
      nzAllowClear
      nzPlaceHolder="Status"
      class="w-full md:w-[150px]">

      <nz-option
        nzValue="Pending"
        nzLabel="Pending">
      </nz-option>

      <nz-option
        nzValue="In Progress"
        nzLabel="In Progress">
      </nz-option>

      <nz-option
        nzValue="Completed"
        nzLabel="Completed">
      </nz-option>

    </nz-select>


    <!-- Priority Filter -->
    <nz-select
      [(ngModel)]="selectedPriority"
      nzAllowClear
      nzPlaceHolder="Priority"
      class="w-full md:w-[150px]">

      <nz-option
        nzValue="High"
        nzLabel="High">
      </nz-option>

      <nz-option
        nzValue="Medium"
        nzLabel="Medium">
      </nz-option>

      <nz-option
        nzValue="Low"
        nzLabel="Low">
      </nz-option>

    </nz-select>


    <!-- Clear -->
    @if (searchTerm || selectedStatus || selectedPriority) {

      <button
        nz-button
        nzType="text"
        (click)="clearFilters()"
        class="!text-xs !text-gray-500">

        Clear

      </button>

    }

  </div>


  <!-- Table -->
  <div class="px-3 py-5 md:px-6">

    <nz-table
      #taskTable
      [nzData]="filteredTasks"
      [nzBordered]="true"
      [nzPageSize]="10"
      [nzShowPagination]="true"
      [nzScroll]="{ x: '850px' }">

      <thead>

        <tr>

          <th nzWidth="22%">
            Task
          </th>

          <th nzWidth="18%">
            Assigned To
          </th>

          <th nzWidth="14%">
            Priority
          </th>

          <th nzWidth="16%">
            Deadline
          </th>

          <th nzWidth="18%">
            Status
          </th>

          <th nzWidth="12%" nzAlign="center">
            Action
          </th>

        </tr>

      </thead>


      <tbody>

        @for (task of taskTable.data; track task.id) {

          <tr>

            <!-- Task -->
            <td>
              <span class="font-medium text-gray-800">
                {{ task.title }}
              </span>
            </td>


            <!-- Assigned To -->
            <td>
              {{ task.assignedTo }}
            </td>


            <!-- Priority -->
            <td>

              <nz-tag [nzColor]="getPriorityColor(task.priority)">
                {{ task.priority }}
              </nz-tag>

            </td>


            <!-- Deadline -->
            <td>
              {{ task.deadline | date:'MMM d, y' }}
            </td>


            <!-- Status -->
            <td>

              <nz-tag [nzColor]="getStatusColor(task.status)">
                {{ task.status }}
              </nz-tag>

            </td>


            <!-- Actions -->
            <td nzAlign="center">

              <button
                nz-button
                nzType="text"
                nz-dropdown
                [nzDropdownMenu]="actionMenu"
                nzPlacement="bottomRight"
                class="!h-8 !w-8 !p-0">

                <span class="text-xl leading-none text-gray-500">
                  ⋮
                </span>

              </button>


              <nz-dropdown-menu #actionMenu="nzDropdownMenu">

                <ul nz-menu>

                  <li
                    nz-menu-item
                    (click)="editTask(task)">

                    <span nz-icon nzType="edit"></span>

                    Edit

                  </li>


                  <li
                    nz-menu-item
                    (click)="deleteTask(task)"
                    class="!text-red-500">

                    <span nz-icon nzType="delete"></span>

                    Delete

                  </li>

                </ul>

              </nz-dropdown-menu>

            </td>

          </tr>

        }

      </tbody>

    </nz-table>

  </div>

</div>
